name: Prices

# Rebuilds prices.json from TCGCSV once a day, adds the day to the price
# history in history/, and commits both to main in one commit when they
# changed. See README.md for what to do when a run fails.

on:
  schedule:
    # Every hour, at 17 minutes past. TCGCSV updates once a day at about
    # 20:05 UTC, and GitHub often starts scheduled runs hours late, so an
    # hourly schedule publishes each update soon after it appears.
    #
    # Hourly does not mean contacting TCGCSV hourly. A run reads the
    # published prices.json first and, if TCGCSV's last update was less than
    # 23 hours ago, stops without making a single request. Only a run 23
    # hours or more after the last update reads last-updated.txt, and only
    # the first run after the new update downloads the price files. On a
    # normal day TCGCSV is contacted by one or two runs.
    #
    # When the update is late, the job backs off. Once prices.json is 29
    # hours old or more (TCGCSV has not updated, or runs keep failing), a
    # scheduled run asks TCGCSV only in the 00, 06, 12 and 18 UTC hours;
    # every other run stops without a request. A day with no update costs
    # about 6 single requests and then 4 a day, and a failure that does not
    # clear repeats at most about 6 times and then 4 times a day.
    - cron: "17 * * * *"
  # A run started by hand always reads last-updated.txt, whatever the age
  # of prices.json (--check-now below).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -I -m unittest discover -s tests

      - name: Build prices.json and append to the history
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python -I scripts/build_prices.py --check-now
          else
            python -I scripts/build_prices.py
          fi

      - name: Commit prices.json and the history if they changed
        # A manual run on another branch builds and tests but never publishes.
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "$(git status --porcelain -- prices.json history)" ]; then
            echo "prices.json and history unchanged; nothing to commit"
            exit 0
          fi
          as_of=$(python -I -c 'import json; print(json.load(open("prices.json"))["sourceUpdatedAt"])')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json history
          git commit -m "Prices as of ${as_of}"
          git push origin HEAD:main
